buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                plugin_portal_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'Fabric'
            url = uri 'https://maven.fabricmc.net/'
            content {
                fabric_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
    }
    dependencies {
        classpath "$loom_plugin:$loom_version"
        classpath "$shadow_plugin:$shadow_version"
    }
}

apply from: rootProject.file('gradle\\java17-module.gradle')
apply from: rootProject.file('gradle\\fabric.gradle')

plugins.apply 'fabric-loom'

def base = project ':api'
def fabric = project ':fabric'
def shared = project ':shared:shared_1.19'

configurations {
    dev {
        canBeResolved = false
        canBeConsumed = true
    }
}

repositories {
    maven {
        name 'Modrinth'
        url = uri 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "$fabric_mc:$minecraft_1_19_2"
    mappings loom.layered() {
        officialMojangMappings()
        parchment "$parchment_data-$minecraft_1_19_2:$parchment_1_19_2@zip"
    }

    compileOnlyApi base
    api project(path: ':fabric', configuration: 'dev')
    compileOnlyApi project(path: ':shared:shared_1.19', configuration: 'dev')

    modImplementation "$fabric_loader_artifact:$fabric_loader"
    modImplementation "$fabric_api_artifact:$fabric_1_19_2"
}

processResources {
    from fabric.processResources.outputs
}

processTestResources {
    from fabric.processTestResources.outputs
}

compileJava {
    source fabric.sourceSets.main.allJava
}

compileTestJava {
    source fabric.sourceSets.test.allJava
}

jar {
    setArchiveBaseName mod_id
    from(fabric.jar.archiveFile.collect { zipTree it })
}

artifacts {
    dev jar
}

tasks.compileJava.mustRunAfter ':fabric:build'
tasks.compileJava.mustRunAfter ':shared:shared_1.19:build'