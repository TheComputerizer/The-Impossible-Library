//These need to be remapped to the com.mojang package
def renderRemaps = [ 'net.minecraft.client.MainWindow': 'blaze3d.platform.Window',
                     'net.minecraft.client.renderer.BufferBuilder': 'blaze3d.vertex.BufferBuilder',
                     'net.minecraft.client.renderer.Tessellator': 'blaze3d.vertex.Tesselator',
                     'net.minecraft.client.renderer.vertex.DefaultVertexFormats': 'blaze3d.vertex.DefaultVertexFormat',
                     'net.minecraft.client.renderer.vertex.Vertex': 'blaze3d.vertex.Vertex',
                     'net.minecraft.util.math.vector.Matrix4f': 'math.Matrix4f',
                     'com.mojang.blaze3d.matrix.MatrixStack': 'blaze3d.vertex.PoseStack',
                     'com.mojang.blaze3d.vertex.IVertexBuilder': 'blaze3d.vertex.VertexConsumer'
]

shadowJar {
    shared.afterEvaluate {
        from it.sourceSets.main.output.classesDirs.asFileTree
        relocate shared_base_package, fabric_base_package
        remapThese.forEach((key,value) -> relocate "net.minecraft.$key", "net.minecraft.$value")
        renderRemaps.forEach((key,value) -> relocate key, "com.mojang.$value")
    }
}

tasks.assemble.dependsOn shadowJar
tasks.shadowJar.finalizedBy remapJar
tasks.jar.finalizedBy shadowJar
tasks.compileJava.mustRunAfter ':fabric:build'
tasks.compileJava.mustRunAfter ':shared:shared_1.16:build'