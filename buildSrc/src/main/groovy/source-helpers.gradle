import org.codehaus.groovy.runtime.MethodClosure

ext.setupIntelliJGenGraph = this.&setupIntelliJGenGraph as MethodClosure
ext.setupJarGraphs = this.&setupJarGraphs as MethodClosure
ext.setupSourceGenGraph = this.&setupSourceGenGraph as MethodClosure

@SuppressWarnings('GrUnresolvedAccess')
String getFullTaskPath(String p_name, String t_name) {
    return "${getFullPath(p_name)}:$t_name"
}

List<String> getIntelliJGenTypes() {
    return switch(name) {
        case '1.12', 'cleanroom', 'fabric', 'forge', 'neoforge' -> [ 'genIntellijRuns' ]
        case 'shared_1.16', 'shared_1.18', 'shared_1.19', 'shared_1.19.2', 'shared_1.19.4', 'shared_1.20.1' ->
            [ 'genIntellijRuns', 'tilfabricGenIntellijRuns', 'tilforgeGenIntellijRuns' ]
        case 'shared_1.20', 'shared_1.20.4', 'shared_1.20.6', 'shared_1.21', 'shared_1.21.1' ->
            [ 'genIntellijRuns', 'tilfabricGenIntellijRuns', 'tilforgeGenIntellijRuns', 'tilneoforgeGenIntellijRuns' ]
        default -> []
    }
}

List<String> getJarParents() {
    return switch(name) {
        case '1.12', 'cleanroom' -> [ 'legacy' ]
        case 'fabric', 'forge', 'legacy', 'neoforge', 'shared' -> [ 'api' ]
        case 'shared_1.16', 'shared_1.18', 'shared_1.19', 'shared_1.20' -> [ 'fabric', 'forge', 'shared' ]
        case 'shared_1.21' -> [ 'fabric', 'forge', 'neoforge', 'shared' ]
        case 'shared_1.20.1' -> [ 'shared_1.20' ]
        case 'shared_1.20.4', 'shared_1.20.6' -> [ 'neoforge', 'shared_1.20' ]
        case 'shared_1.21.1' -> [ 'shared_1.21' ]
        default -> parent==null ? [ '1.12', 'shared_1.16', 'shared_1.18', 'shared_1.19.2', 'shared_1.19.4',
                                       'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6', 'shared_1.21.1' ] : []
    }
}

List<String> getPreviousGenFabricIntelliJRuns() {
    return switch(name) {
        case 'shared_1.19.2', 'shared_1.19.4' -> [ 'shared_1.16', 'shared_1.18', 'shared_1.19' ]
        case 'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6' -> [ 'shared_1.16', 'shared_1.18', 'shared_1.20' ]
        case 'shared_1.21.1' -> [ 'shared_1.16', 'shared_1.18', 'shared_1.21' ]
        default -> []
    }
}

@SuppressWarnings('unused')
List<String> getPreviousGenFabricSources(boolean exclude_problematic_versions) {
    return switch(name) {
        case 'shared_1.19.2', 'shared_1.19.4' -> [ 'shared_1.19' ]
        case 'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6' -> [ 'shared_1.20' ]
        case 'shared_1.21.1' -> [ 'shared_1.21' ]
        default -> parent==null ? [ 'shared_1.16', 'shared_1.18', 'shared_1.19.2', 'shared_1.19.4', 'shared_1.20.1',
                                    'shared_1.20.4', 'shared_1.20.6', 'shared_1.21.1' ] : []
    }
}

List<String> getPreviousGenForgeIntelliJRuns() {
    return switch(name) {
        case 'shared_1.19.2', 'shared_1.19.4' -> [ 'shared_1.16', 'shared_1.18', 'shared_1.19' ]
        case 'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6' -> [ 'shared_1.16', 'shared_1.18', 'shared_1.20' ]
        case 'shared_1.21.1' -> [ 'shared_1.16', 'shared_1.18', 'shared_1.21' ]
        default -> []
    }
}

List<String> getPreviousGenForgeSources(boolean exclude_problematic_versions) {
    return switch(name) {
        case 'shared_1.19.2', 'shared_1.19.4' -> [ 'shared_1.19' ]
        case 'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6' -> [ 'shared_1.20' ]
        case 'shared_1.21.1' -> [ 'shared_1.21' ]
        default -> parent==null ? (exclude_problematic_versions ? [ 'shared_1.18', 'shared_1.19.2', 'shared_1.19.4',
                  'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6', 'shared_1.21.1' ] : [ 'shared_1.16', 'shared_1.18',
                  'shared_1.19.2', 'shared_1.19.4', 'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6',
                  'shared_1.21.1' ]) : []
    }
