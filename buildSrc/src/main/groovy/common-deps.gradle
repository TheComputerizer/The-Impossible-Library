repositories {
    mavenCentral() {
        content {
            [ burningwave_group, lombok_group, toolfactory_group ].forEach {grp ->
                includeGroup grp
            }
        }
    }
}

@SuppressWarnings(['DependencyNotationArgument','GrUnresolvedAccess'])
private void addBundledDependencies() {
    dependencies {
        annotationProcessor libs.lombok
        compileOnly libs.lombok
        implementation libs.bundles.burningwave
    }
}

addBundledDependencies()