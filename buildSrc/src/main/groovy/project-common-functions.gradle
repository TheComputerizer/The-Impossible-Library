import org.codehaus.groovy.runtime.MethodClosure

import static org.gradle.api.file.DuplicatesStrategy.EXCLUDE

/**
 * Initialize Java & helper plugins
 */
plugins {
    id 'java-shared'
}

ext.createClassConfigs = this.&createClassConfigs as MethodClosure
ext.createClassesImport = this.&createClassesImport as MethodClosure
ext.createLoaderClassConfigs = this.&createLoaderClassConfigs as MethodClosure
ext.getSourceBuildFile = this.&getSourceBuildFile as MethodClosure
ext.getBuildFiles = this.&getBuildFiles as MethodClosure
ext.getBuildPath = this.&getBuildPath as MethodClosure
ext.getBuildPaths = this.&getBuildPaths as MethodClosure
ext.getFullPath = this.&getFullPath as MethodClosure
ext.getLoaderList = this.&getLoaderList as MethodClosure
ext.getManifestEntries = this.&getManifestEntries as MethodClosure
ext.getParentFromName = this.&getParentFromName as MethodClosure
ext.getSubProjectLevel = this.&getSubProjectLevel as MethodClosure
ext.initCommonDeps = this.&initCommonDeps as MethodClosure
ext.setDefaultManifestAttributes = this.&setDefaultManifestAttributes as MethodClosure
ext.setJarsRunAfter = this.&setJarsRunAfter as MethodClosure
ext.sourceClassesDir = this.&sourceClassesDir as MethodClosure

void createClassConfigs(boolean add_import, boolean add_export) {
    if(add_import) createClassesImport 'parentClasses', 'inheritParentClasses', 'classes', 'main'
    if(add_export) createClassesExport 'exportClasses', 'main'
}

private void createClassesExport(String c_name, String s_name) {
    //noinspection GrUnresolvedAccess
    createConfiguration c_name, true, false
    artifacts.add c_name, sourceSets.named(s_name).get().java.destinationDirectory
}

void createClassesImport(String c_name, String t_name, String c_t_name, String s_name) {
    //noinspection GrUnresolvedAccess
    createConfiguration c_name, false, true
    tasks.register(t_name, Copy) {copy_task ->
        mustRunAfter compileJava
        destinationDir = sourceClassesDir s_name
        duplicatesStrategy = EXCLUDE
        from configurations.named(c_name)
    }
    tasks.named(c_t_name).configure {
        dependsOn t_name
    }
}

void createLoaderClassConfigs() {
    //noinspection GrUnresolvedAccess
    (getLoaderList(true)).forEach {loader ->
        String l_loader = loader.toLowerCase()
        String c_name = "parent${loader}Classes"
        String t_name = "inheritParent${loader}Classes"
        createClassesImport c_name, t_name, "til${l_loader}Classes", "til$l_loader"
        createClassesExport "export${loader}Classes", "til$l_loader"
        tasks.named(t_name).configure {
            mustRunAfter "compileTil${l_loader}Java"
        }
    }
}

/**
 * Map<sourcename,relativepaths>
 * Any paths that resolve to a nonexistant directory will create a new directory at that path
 */
ConfigurableFileCollection getBuildFiles(Map<String,List<String>> pathMap) {
    ConfigurableFileCollection ret = files(getBuildPaths(pathMap))
    ret.files.forEach {
        if(!it.exists() && !it.name.contains('.')) it.mkdirs()
    }
    return ret
}

String getBuildPath(String relative_path, String source_name) {
    return "${projectDir.absolutePath}\\build\\$relative_path\\$source_name"
}

List<String> getBuildPaths(Map<String,List<String>> pathMap) {
    logger.lifecycle "Relative path map = $pathMap"
    List<String> paths = []
    pathMap.forEach {source_name,relative_paths ->
        relative_paths.forEach {relative_path ->
            paths.add getBuildPath(relative_path, source_name)
        }
    }
    logger.lifecycle "Returning full paths $paths"
    return paths
}

/**
 * Returns the full project path in the format ':p_name', or ':parent_path:p_name' depending on whether a parent exists
 */
static String getFullPath(String p_name) {
    String p_path = p_name.startsWith(':') ? p_name : ":$p_name"
    String parent_name = getParentFromName p_name
    while(parent_name!=null) {
        p_path = ":$parent_name$p_path"
        parent_name = getParentFromName parent_name
    }
    return p_path
}

@SuppressWarnings('GrUnresolvedAccess')
List<String> getLoaderList(boolean capitalized) {
    if(isLoaderBase() || !isSharedProject()) return []
    def loader_list = capitalized ? [ 'Fabric', 'Forge' ] : [ 'fabric', 'forge' ]
    if(isNeoforgeCompatible()) loader_list+=(capitalized ? 'Neoforge' : 'neoforge')
    return loader_list
}

Map<String,Object> getManifestEntries() {
    Map<String,Object> attribute_map = [ 'Implementation-Title': mod_name, 'Implementation-Version': mod_version ]
    //noinspection GrUnresolvedAccess
    if(isLegacyProject()) {
        attribute_map['FMLCorePlugin'] = legacy_entrypoint
        attribute_map['FMLCorePluginContainsFMLMod'] = true
        attribute_map['ForceLoadAsMod'] = true
    }
    return attribute_map
}

static String getParentFromName(String p_name) {
    if(p_name==null) return null
    return switch(p_name.startsWith(':') ? p_name.substring(1) : p_name) {
        case '1.12', 'cleanroom' -> 'legacy'
        case 'shared_1.16', 'shared_1.18', 'shared_1.19', 'shared_1.20', 'shared_1.21' -> 'shared'
        case 'shared_1.19.2', 'shared_1.19.4' -> 'shared_1.19'
        case 'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6' -> 'shared_1.20'
        case 'shared_1.21.1' -> 'shared_1.21'
        default -> null
    }
}

ConfigurableFileCollection getSourceBuildFile(String relative_path, String source_name) {
    return files(getBuildPath(relative_path, source_name))
}

static int getSubProjectLevel(String p_name) {
    return switch(p_name) {
        case 'api', 'fabric', 'forge', 'legacy', 'neoforge', 'shared' -> 1
        case '1.12', 'cleanroom', 'shared_1.16', 'shared_1.18', 'shared_1.19', 'shared_1.20', 'shared_1.21' -> 2
        case 'shared_1.19.2', 'shared_1.19.4', 'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6', 'shared_1.21.1' -> 3
        default -> 0
    }
}

/**
 * Initialize the common-deps plugin
 */
void initCommonDeps() {
    plugins.apply 'common-deps'
}

void setDefaultManifestAttributes() {
    jar {
        doFirst {
            manifest {
                Map<String,Object> manifest_attributes = getManifestEntries()
                attributes(manifest_attributes)
            }
        }
    }
}

@SuppressWarnings('GrUnresolvedAccess')
void setJarsRunAfter(List<String> p_names) {
    setDefaultManifestAttributes()
    def build_tasks = p_names.collect {p_name ->
        "${getFullPath(p_name)}:build".toString()
    }
    jar {
        build_tasks.forEach {build_task ->
            mustRunAfter build_task
        }
    }
    sourcesJar {
        build_tasks.forEach {build_task ->
            mustRunAfter build_task
        }
    }
}

@SuppressWarnings('GrMethodMayBeStatic')
File sourceClassesDir(String source_name) {
    SourceSet source = sourceSets.named(source_name).get()
    DirectoryProperty java_destination = source.java.destinationDirectory
    return java_destination.asFile.get()
}