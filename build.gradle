/**
 * BUILD WORKFLOW
 *
 * Main project:
 *      1: Apply shadow plugin
 *      2: Apply the functions & shared scripts
 *      3: Do some preliminary setup for the jar & shadowJar tasks
 *
 * Sub Projects:
 *      [BEFORE EVALUATING]
 *          1: Apply the functions & shared scripts
 *
 *      [AFTER EVALUATING]
 *          1: Wait until all sub projects finish building before running the main project jar task
 *          2: Each subproject with loader sources has it's build task run after the relevant source jar tasks
 *          3: Each jar task must do any necessary remapping in the relevant sub project
 *          4: Inherit resources from the fabric sub project (which inherits from the api sub project)
 *          5: Finalize the jar task with shadowJar
 *          6: Collect the contents of all sub project jars in the shadowJar task
 *          7: Do any necessary relocations & exclusions for shading before finalizing the jar
 *          8: Add all relevant sub project classpaths the javadoc task
 *          9: Include all content from sub project javadoc and source jars in the relevant main project jars
 */


/*
 * External Plugin List
 *
 * - Gradle Doctor
 *      + [id] com.osacky.doctor
 *      + [docs] https://runningcode.github.io/gradle-doctor/
 *      + [desc] Helps to diagnose build performance issues & can only be applied in the root project
 *
 * - Shadow
 *      + [id] com.gradleup.shadow
 *      + [docs] https://gradleup.com/shadow/
 *      + [desc] FatJar builder & package relocator
 *
 * - Unimined
 *      + [id] unimined
 *      + [docs] https://github.com/unimined/Unimined/blob/main/Writerside/topics/starter-topic.md
 *      + [desc] Minecraft provider & remapper
 */
plugins {
    alias libs.plugins.doctor
    id 'shaded-deps'
}

tasks.register('fixManifest', Jar) {
    dependsOn shadowJar
    archiveBaseName = mod_id
    archiveClassifier = ''
    manifest {
        attributes([
                'FMLCorePlugin': legacy_entrypoint,
                'FMLCorePluginContainsFMLMod': true,
                'ForceLoadAsMod': true,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'TILMultiversionCoreMods': core_entrypoint,
                'TILMultiversionMods': common_entrypoint
        ])
    }
}

tasks.assemble.dependsOn fixManifest
tasks.fixManifest.dependsOn shadowJar
tasks.jar.finalizedBy shadowJar
tasks.shadowJar.finalizedBy fixManifest

createClassesImport 'allClasses', 'gatherAllClasses', 'classes', null

private static List<String> getLoaders(String p_name) {
    return switch(p_name) {
        case '1.12' -> [ '' ]
        case 'shared_1.16', 'shared_1.18', 'shared_1.19.2', 'shared_1.19.4', 'shared_1.20.1' ->
            [ '', 'Fabric', 'Forge' ]
        case 'shared_1.20.4', 'shared_1.20.6', 'shared_1.21.1' -> [ '', 'Fabric', 'Forge', 'Neoforge' ]
        default -> []
    }
}

[ '1.12', 'shared_1.16', 'shared_1.18', 'shared_1.19.2', 'shared_1.19.4', 'shared_1.20.1', 'shared_1.20.4',
  'shared_1.20.6', 'shared_1.21.1' ].forEach {included_project ->
    String p_path = getFullPath(included_project)
    getLoaders(included_project).forEach {loader ->
        tasks.compileJava.mustRunAfter "$p_path:inheritParent${loader}Classes"
        dependencies {
            allClasses project(path: p_path, configuration: "export${loader}Classes")
        }
    }
}

//noinspection GrUnresolvedAccess
applySourceHelpers()

