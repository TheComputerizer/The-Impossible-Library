/**
 * Build workflow guidelines
 * api -> (fabric, forge, legacy, neoforge) -> (1.12, 1.16, 1.18, 1.19, 1.20, 1.21) -> (minor versions) -> main
 * Shading and relocation must happen within each module to properly respect reobfuscation.
 * Any necessary reobfuscations must happen in the version the deobfuscations happened in.
 */
apply from: rootProject.file('shared.gradle')

def cleanroom = project ':legacy:cleanroom'
def fabric = project ':fabric'
def legacy_1_12_2 = project ':legacy:1.12'
def fabric_1_16_5 = project ':fabric:fabric_1.16'
def fabric_1_18_2 = project ':fabric:fabric_1.18'
def fabric_1_19_2 = project ':fabric:fabric_1.19:fabric_1.19.2'
def fabric_1_19_4 = project ':fabric:fabric_1.19:fabric_1.19.4'
def fabric_1_20_1 = project ':fabric:fabric_1.20:fabric_1.20.1'
def fabric_1_20_4 = project ':fabric:fabric_1.20:fabric_1.20.4'
def fabric_1_20_6 = project ':fabric:fabric_1.20:fabric_1.20.6'
def fabric_1_21_1 = project ':fabric:fabric_1.21:fabric_1.21.1'
def forge_1_16_5 = project ':forge:forge_1.16'
def forge_1_18_2 = project ':forge:forge_1.18'
def forge_1_19_2 = project ':forge:forge_1.19:forge_1.19.2'
def forge_1_19_4 = project ':forge:forge_1.19:forge_1.19.4'
def forge_1_20_1 = project ':forge:forge_1.20:forge_1.20.1'
def forge_1_20_4 = project ':forge:forge_1.20:forge_1.20.4'
def forge_1_20_6 = project ':forge:forge_1.20:forge_1.20.6'
def forge_1_21_1 = project ':forge:forge_1.21:forge_1.21.1'
def neoforge_1_20_4 = project ':neoforge:neoforge_1.20:neoforge_1.20.4'
def neoforge_1_20_6 = project ':neoforge:neoforge_1.20:neoforge_1.20.6'
def neoforge_1_21_1 = project ':neoforge:neoforge_1.21:neoforge_1.21.1'

def fabric_projects = [ fabric_1_16_5, fabric_1_18_2, fabric_1_19_2, fabric_1_19_4, fabric_1_20_1, fabric_1_20_4,
        fabric_1_20_6, fabric_1_21_1
]

def shadow_projects = [ cleanroom, legacy_1_12_2, forge_1_16_5, forge_1_18_2, forge_1_19_2, forge_1_19_4, forge_1_20_1,
        forge_1_20_4, neoforge_1_20_4, forge_1_20_6, neoforge_1_20_6, forge_1_21_1, neoforge_1_21_1
]

def jar_projects = [ cleanroom, legacy_1_12_2, fabric_1_16_5, forge_1_16_5, fabric_1_18_2, forge_1_18_2, fabric_1_19_2,
        forge_1_19_2, fabric_1_19_4, forge_1_19_4, fabric_1_20_1, forge_1_20_1, fabric_1_20_4, forge_1_20_4,
        neoforge_1_20_4, fabric_1_20_6, forge_1_20_6, neoforge_1_20_6, fabric_1_21_1, forge_1_21_1, neoforge_1_21_1
]

def all_projects = [ project(':api'), fabric, project('forge'), project(':legacy'), project('neoforge'), cleanroom,
        legacy_1_12_2, fabric_1_16_5, forge_1_16_5, fabric_1_18_2, forge_1_18_2, project(':fabric:fabric_1.19'),
        project(':forge:forge_1.19'), fabric_1_19_2, forge_1_19_2, fabric_1_19_4, forge_1_19_4,
        project(':fabric:fabric_1.20'), project(':forge:forge_1.20'), project(':neoforge:neoforge_1.20'), fabric_1_20_1,
        forge_1_20_1, fabric_1_20_4, forge_1_20_4, neoforge_1_20_4, fabric_1_20_6, forge_1_20_6, neoforge_1_20_6,
        project(':fabric:fabric_1.21'), project(':forge:forge_1.21'), project(':neoforge:neoforge_1.21'), fabric_1_21_1,
        forge_1_21_1, neoforge_1_21_1
]

subprojects {
    it.afterEvaluate {
        it.tasks.withType(JavaCompile).forEach {
            it.options.deprecation = false //We don't need to log all of the deprecated stuff when compiling
            it.outputs.cacheIf {
                false //Prevent issues with parallelization
            }
        }
    }
}

processResources {
    fabric.afterEvaluate {
        from it.processResources.outputs
    }
}

processTestResources {
    fabric.afterEvaluate {
        from it.processTestResources.outputs
    }
}

javadoc {
    afterEvaluate {
        classpath = files(all_projects.collect { it.sourceSets.main.compileClasspath })
    }
}

jar {
    fabric_projects.forEach {
        it.afterEvaluate {
            from(it.remapJar.archiveFile.collect { zipTree it })
        }
    }
    shadow_projects.forEach {
        it.afterEvaluate {
            from(it.shadowJar.archiveFile.collect { zipTree it })
        }
    }
    manifest {
        attributes([
                'FMLCorePlugin': legacy_entrypoint,
                'FMLCorePluginContainsFMLMod': true,
                'ForceLoadAsMod': true,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'TILMultiversionCoreMods': core_entrypoint,
                'TILMultiversionMods': common_entrypoint
        ])
    }
}

javadocJar {
    all_projects.forEach {
        it.afterEvaluate {
            from(it.javadocJar.archiveFile.collect { zipTree it })
            mustRunAfter it.javadocJar
        }
    }
}

sourcesJar {
    all_projects.forEach {
        it.afterEvaluate {
            from(it.sourcesJar.archiveFile.collect { zipTree it })
            mustRunAfter it.sourcesJar
        }
    }
}

[ ':legacy:1.12:shadowJar', ':legacy:cleanroom:shadowJar',
  ':fabric:fabric_1.16:remapJar', ':forge:forge_1.16:shadowJar',
  ':fabric:fabric_1.18:remapJar', ':forge:forge_1.18:shadowJar',
  ':fabric:fabric_1.19:fabric_1.19.2:remapJar', ':forge:forge_1.19:forge_1.19.2:shadowJar',
  ':fabric:fabric_1.19:fabric_1.19.4:remapJar', ':forge:forge_1.19:forge_1.19.4:shadowJar',
  ':fabric:fabric_1.20:fabric_1.20.1:remapJar', ':forge:forge_1.20:forge_1.20.1:shadowJar',
  ':fabric:fabric_1.20:fabric_1.20.4:remapJar', ':forge:forge_1.20:forge_1.20.4:shadowJar', ':neoforge:neoforge_1.20:neoforge_1.20.4:assemble',
  ':fabric:fabric_1.20:fabric_1.20.6:remapJar', ':forge:forge_1.20:forge_1.20.6:shadowJar', ':neoforge:neoforge_1.20:neoforge_1.20.6:assemble',
  ':fabric:fabric_1.21:fabric_1.21.1:remapJar', ':forge:forge_1.21:forge_1.21.1:shadowJar', ':neoforge:neoforge_1.21:neoforge_1.21.1:assemble'
].forEach { tasks.jar.mustRunAfter it }