/**
 * Build workflow guidelines
 * api -> (fabric, forge, legacy, neoforge) -> (1.12, 1.16, 1.18, 1.19, 1.20, 1.21) -> (minor versions) -> main
 * Shading and relocation must happen within each module to properly respect reobfuscation.
 * Any necessary reobfuscations must happen in the version the deobfuscations happened in.
 */
allprojects {p ->
    p.apply from: rootProject.file('gradle\\scripts\\functions.gradle')
}

extendFrom 'shared'

def base = ':api'
def cleanroom = ':legacy:cleanroom'
def fabric = ':fabric'
def forge = ':forge'
def legacy = ':legacy'
def legacy_1_12_2 = ':legacy:1.12'
def neoforge = ':neoforge'
def shared_1_16_5 = ':shared:shared_1.16'
def shared_1_18_2 = ':shared:shared_1.18'
def shared_1_19 = ':shared:shared_1.19'
def shared_1_19_2 = ':shared:shared_1.19:shared_1.19.2'
def shared_1_19_4 = ':shared:shared_1.19:shared_1.19.4'
def shared_1_20 = ':shared:shared_1.20'
def shared_1_20_1 = ':shared:shared_1.20:shared_1.20.1'
def shared_1_20_4 = ':shared:shared_1.20:shared_1.20.4'
def shared_1_20_6 = ':shared:shared_1.20:shared_1.20.6'
def shared_1_21 = ':shared:shared_1.21'
def shared_1_21_1 = ':shared:shared_1.21:shared_1.21.1'

def all_projects = [ base, fabric, forge, legacy, neoforge, cleanroom, legacy_1_12_2, shared_1_16_5, shared_1_18_2,
        shared_1_19, shared_1_19_2, shared_1_19_4, shared_1_20, shared_1_20_1, shared_1_20_4, shared_1_20_6,
        shared_1_21, shared_1_21_1 ]

jar {
    manifest {
        attributes([
                'FMLCorePlugin': legacy_entrypoint,
                'FMLCorePluginContainsFMLMod': true,
                'ForceLoadAsMod': true,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'TILMultiversionCoreMods': core_entrypoint,
                'TILMultiversionMods': common_entrypoint
        ])
    }
}

afterEvaluate {self ->
    def resolved_projects = all_projects.collect {p_name ->
        self.project(p_name)
    }
    resolved_projects.forEach {sub ->
        sub.tasks.withType(JavaCompile).forEach {compile ->
            compile.options.deprecation = false //We don't need to log all of the deprecated stuff when compiling
        }
        sub.afterEvaluate {s ->
            if(isProjectRunnable(s)) {
                self.jar {
                    def archive_task = getArchiveTask(s, 'shadowJar')
                    from(archive_task.archiveFile.collect {entry ->
                        zipTree entry
                    })
                    mustRunAfter archive_task
                }
            }
            self.javadoc {
                classpath+=classpathCompile(s, 'main')
            }
            self.javadocJar {
                def archive_task = getArchiveTask(s, 'javadocJar')
                from(archive_task.archiveFile.collect {zip ->
                    zipTree zip
                })
                mustRunAfter archive_task
            }
            if('fabric'==s.name) {
                self.processResources {
                    from getTaskOutputs(s, 'processResources')
                }
                self.processTestResources {
                    from getTaskOutputs(s, 'processTestResources')
                }
            }
            self.sourcesJar {
                def archive_task = getArchiveTask(s, 'sourcesJar')
                from(archive_task.archiveFile.collect {entry ->
                    zipTree entry
                })
                mustRunAfter archive_task
            }
        }
    }
}