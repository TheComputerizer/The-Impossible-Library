/**
 * Common base for all legacy builds (pre 1.16)
 */

plugins {
    id 'project-common-functions'
}

/**
 * Only bundled for consolidated warning suppression
 */
@SuppressWarnings('GrMethodMayBeStatic')
private void initSetup() {
    setJavaVersion 8
    createResourceArtifact()
    initCommonDeps()
}

initSetup()

createClassConfigs false, true

dependencies {
    compileOnly project(':api')
}

addParentProcessedResources()

tasks.compileJava.mustRunAfter ':api:classes'