/**
 * Common base for all legacy builds (pre 1.16)
 */

extendFrom project, 'shared'

java {
    toolchain.languageVersion = JavaLanguageVersion.of 8
}

dependencies {
    compileOnlyApi project(':api')
}

processResources {
    def replacements = [ 'minecraft_version': minecraft_1_12_2, 'mod_author': mod_authors,
                         'mod_description': mod_description, 'mod_license': mod_license, 'mod_id': mod_id,
                         'mod_name': mod_name, 'mod_version': version ]
    inputs.properties replacements
    def parentResources =  project(':api').processResources.outputs
    from(parentResources) {
        exclude 'fabric.mod.json', 'mcmod.info', 'META-INF/mods.toml'
    }
    from(parentResources) {
        include 'mcmod.info'
        expand replacements
    }
}

processTestResources {
    from project(':api').processTestResources.outputs
}

setJarsRunAfter false, ':api'

subprojects {sub ->
    extendRunnable sub, 'cleanroom'==sub.name ? 21 : 8
    jar {
        sub.afterEvaluate {
            from(project(':legacy').jar.archiveFile.collect {entry ->
                zipTree entry
            })
            manifest {
                attributes([
                        'FMLCorePlugin': legacy_entrypoint,
                        'FMLCorePluginContainsFMLMod': true,
                        'ForceLoadAsMod': true,
                        'Implementation-Title': mod_name,
                        'Implementation-Version': mod_version
                ])
            }
        }
    }
}