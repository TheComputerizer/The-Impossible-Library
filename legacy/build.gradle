import static org.gradle.api.logging.LogLevel.INFO
import static org.gradle.api.logging.LogLevel.QUIET

buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                unimined_plugin_portal.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'WagYourMaven Releases'
            url = uri 'https://maven.wagyourtail.xyz/releases'
            content {
                unimined_releases.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'WagYourMaven Snapshots'
            url = uri 'https://maven.wagyourtail.xyz/snapshots'
            content {
                unimined_snapshots.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
    }
    dependencies {
        classpath "$shadow_plugin:$shadow_version"
        classpath "$unimined_plugin:$unimined_version"
    }
}

apply from: rootProject.file('gradle\\scripts\\shared.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of 8
}

def base = project ':api'

dependencies {
    compileOnlyApi base
}

processResources {
    def replacements = [ 'minecraft_version': minecraft_1_12_2, 'mod_author': mod_authors,
                         'mod_description': mod_description, 'mod_license': mod_license, 'mod_id': mod_id,
                         'mod_name': mod_name, 'mod_version': version ]
    inputs.properties replacements
    def parentResources = base.processResources.outputs
    from(parentResources) { exclude 'fabric.mod.json', 'mcmod.info', 'META-INF/mods.toml' }
    from(parentResources) {
        include 'mcmod.info'
        expand replacements
    }
}

processTestResources {
    from base.processTestResources.outputs
}

tasks.jar.dependsOn ':api:build'

subprojects { sub ->
    plugins.apply 'xyz.wagyourtail.unimined'
    unimined.minecraft {
        version minecraft_1_12_2
        def args = [ dev_arg, common_entrypoint_arg, core_entrypoint_arg ]
        mappings {
            mcp 'stable', legacy_mappings_1_12_2
        }
        if('cleanroom'==sub.name) {
            cleanroom {
                loader cleanroom_loader_version
                runs.all {
                    systemProperty 'foundation.verbose', 'true'
                    jvmArgs args
                    return
                }
            }
        } else {
            minecraftForge {
                loader forge_1_12_2
                runs.all {
                    systemProperty 'foundation.verbose', 'true'
                    jvmArgs args
                    return
                }
            }
        }
    }
    tasks.remapJar {
        doFirst {
            logging.captureStandardOutput INFO
        }
        doLast {
            logging.captureStandardOutput QUIET
        }
    }
}