apply from: rootProject.file('buildSrc\\shared.gradle')

def base = project ':api'

dependencies {
    compileOnlyApi base
}

processResources {
    def replacements = [ 'minecraft_version': minecraft_1_12_2, 'mod_author': mod_authors,
                         'mod_description': mod_description, 'mod_license': mod_license, 'mod_id': mod_id,
                         'mod_name': mod_name, 'mod_version': version ]
    inputs.properties replacements
    def parentResources = base.processResources.outputs
    from(parentResources) { exclude 'fabric.mod.json', 'mcmod.info', 'META-INF/mods.toml' }
    from(parentResources) {
        include 'mcmod.info'
        expand replacements
    }
}

processTestResources {
    from base.processTestResources.outputs
}

tasks.jar.dependsOn ':api:build'