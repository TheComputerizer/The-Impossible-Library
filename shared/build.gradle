//file:noinspection GroovyAssignabilityCheck

/**
 * Pass through parent module for shared version modules
 */

extendFrom project, 'shared'

java {
    toolchain.languageVersion = JavaLanguageVersion.of 8
}

setDev

inheritResources ':api'

jar {
    from(project(':api').jar.archiveFile.collect {entry ->
        include 'mods/**'
        zipTree entry
    })
    dependsOn ':api:build'
}

def java21_versions = [ 'shared_1.20.6', 'shared_1.21', 'shared_1.21.1' ]
def neoforge_versions = [ 'shared_1.20', 'shared_1.20.4', 'shared_1.20.6', 'shared_1.21', 'shared_1.21.1' ]
def parent_versions = [ 'shared_1.19', 'shared_1.20', 'shared_1.21' ]
def singleton_versions = [ 'shared_1.16', 'shared_1.18' ]

subprojects {sub ->
    def sub_name = sub.name
    def java_version = 'shared_1.16'==sub_name ? '8' : (java21_versions.contains(sub_name) ? '21' : '17')
    sub.apply from: rootProject.file("gradle\\scripts\\java$java_version-module.gradle")
    boolean neoforge_compatible = neoforge_versions.contains sub_name
    boolean is_runnable = !parent_versions.contains(sub_name)
    boolean has_parent = is_runnable && !singleton_versions.contains(sub_name)
    sourceSets {
        fabric {
            compileClasspath+=sourceSets.main.output
            runtimeClasspath+=sourceSets.main.output
        }
        forge {
            compileClasspath+=sourceSets.main.output
            runtimeClasspath+=sourceSets.main.output
        }
        if(neoforge_compatible) {
            neoforge {
                compileClasspath+=sourceSets.main.output
                runtimeClasspath+=sourceSets.main.output
            }
        }
    }
    if(!is_runnable) setDev
    jar {
        manifest {
            attributes([
                    'Implementation-Title': mod_name,
                    'Implementation-Version': mod_version
            ])
        }
    }
    if(is_runnable) {
        afterEvaluate {
            def shaded_projects = [ ':api', ':fabric', ':forge', ':shared' ]
            if(neoforge_compatible) shaded_projects+=':neoforge'
            if(has_parent) shaded_projects+=getParentPath(":$sub_name")
            setSharedShadowJar shaded_projects.toArray(new String[0])
            tasks.assemble.dependsOn 'shadowJar'
        }
    }
}