/**
 * Pass through parent module for shared version modules
 */

extendFrom 'common-deps'

java {
    toolchain.languageVersion = JavaLanguageVersion.of 8
}

setDev()

inheritResources ':api'

jar {
    from(getArchiveTaskFile(project(':api'), 'jar').collect {entry ->
        include 'mods/**'
        zipTree entry
    })
    dependsOn ':api:build'
}

setJarsRunAfter([ ':api' ]) 