/**
 * Common builds and sources relevant to all NeoForge modules. Based in 1.20.4
 */
plugins {
    alias libs.plugins.unimined
}

extendRunnable()

uniminedCore 'neoforge', false, []

setDev()

dependencies {
    api project(':api')
}

jar {
    manifest {
        attributes([
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version
        ])
    }
}

processResources {
    from(getTaskOutputs(project(':api'), 'processResources')) {
        exclude 'fabric.mod.json'
    }
}

processTestResources {
    from getTaskOutputs(project(':api'), 'processTestResources')
}

setJarsRunAfter ':api'