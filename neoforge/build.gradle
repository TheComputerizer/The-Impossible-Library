/**
 * Common builds and sources relevant to all NeoForge modules. Based in 1.20.4
 */
plugins {
    alias libs.plugins.unimined
    alias libs.plugins.shadow
}

extendRunnable project, 17

uniminedCore project, 'neoforge', false, []

setDev

def base = project ':api'

dependencies {
    api base
}

jar {
    from(base.jar.archiveFile.collect { zipTree it })
    manifest {
        attributes([
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version
        ])
    }
    mustRunAfter ':api:build'
    mustRunAfter ':shared:build'
}