/**
 * Common builds and sources relevant to all NeoForge modules. Based in 1.20.4
 */
//file:noinspection GroovyAssignabilityCheck
buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                plugin_portal_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'NeoForge'
            url = uri 'https://maven.neoforged.net/releases'
            content {
                neoforge_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
    }
    dependencies {
        classpath "$shadow_plugin:$shadow_version"
        classpath "$neoforge_gradle_plugin:$neoforge_gradle_version"
    }
}

apply from: rootProject.file('gradle\\java17-module.gradle')

plugins.apply 'net.neoforged.gradle.userdev'

def base = project ':api'

subsystems {
    parchment {
        minecraftVersion = minecraft_1_20_4
        mappingsVersion = parchment_1_20_4
    }
}

configurations {
    dev {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    implementation "$neoforge_mc:$neoforge_1_20_4"

    api base
}

processResources {
    from(base.processResources.outputs) {
        exclude 'fabric.mod.json'
    }
}

processTestResources {
    from base.processTestResources.outputs
}

jar {
    from(base.jar.archiveFile.collect { zipTree it })
    manifest {
        attributes([
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version
        ])
    }
}

artifacts {
    dev jar
}

tasks.classes.mustRunAfter ':api:jar'