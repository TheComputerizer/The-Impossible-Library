/**
 * NeoForge implementation for 1.21.1
 */
//file:noinspection GroovyAssignabilityCheck
buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                plugin_portal_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'NeoForge'
            url = uri 'https://maven.neoforged.net/releases'
            content {
                neoforge_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
    }
    dependencies {
        classpath "$shadow_plugin:$shadow_version"
        classpath "$neoforge_gradle_plugin:$neoforge_gradle_version"
    }
}

apply from: rootProject.file('gradle\\java21-module.gradle')

plugins.apply 'net.neoforged.gradle.userdev'

def base = project ':api'
def neoforge = project ':neoforge'
def neoforge_specific = project ':neoforge:neoforge_1.21'
def shared = project ':shared:shared_1.21'
def shared_specific = project ':shared:shared_1.21:shared_1.21.1'

subsystems {
    parchment {
        minecraftVersion = minecraft_1_21_1
        mappingsVersion = parchment_1_21_1
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource sourceSets.main
    }
    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }
    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }
}

repositories {
    maven {
        name = 'CurseMaven'
        url = uri 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'ModMaven'
        url = uri 'https://modmaven.dev'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    //noinspection VulnerableLibrariesLocal
    implementation "$neoforge_mc:$neoforge_1_21_1"

    compileOnlyApi base
    compileOnlyApi project(path: ':neoforge', configuration: 'dev')
    compileOnlyApi neoforge_specific
    compileOnlyApi shared
    compileOnlyApi shared_specific

    //mod support dependencies
    implementation "$configured_artifact:$configured_neoforge_1_21_1"
    implementation "$infernal_mobs_artifact:$infernal_mobs_neoforge_1_21_1"
    implementation "$serene_seasons_artifact:$serene_seasons_neoforge_1_21_1"

    runtimeOnly "$glitchcore_artifact:$glitchcore_neoforge_1_21_1"
    runtimeOnly "$jei_artifact:$jei_neoforge_1_21_1"
}

jar {
    manifest {
        attributes([
                'Implementation-Version': mod_version
        ])
    }
}

shadowJar {
    [ base, neoforge, neoforge_specific ].forEach {
        from(it.jar.archiveFile.collect { zipTree it })
    }
    shared_specific.afterEvaluate {
        from(shared.jar.archiveFile.collect { zipTree it })
        from(it.jar.archiveFile.collect { zipTree it })
        relocate "${neoforge_base_package}.client.event.events", "${neoforge_1_21_1_package}.client.event.events"
        relocate "${neoforge_base_package}.common.event.events", "${neoforge_1_21_1_package}.common.event.events"
        relocate shared_base_package, neoforge_base_package
    }
}

tasks.assemble.dependsOn shadowJar
tasks.jar.finalizedBy shadowJar
tasks.jar.dependsOn ':neoforge:neoforge_1.21:build'