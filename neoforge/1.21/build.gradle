import static org.gradle.api.logging.LogLevel.INFO
import static org.gradle.api.logging.LogLevel.QUIET

/**
 * NeoForge implementation for 1.21. Based in 1.21.1
 */
//file:noinspection GroovyAssignabilityCheck
buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                unimined_plugin_portal.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'WagYourMaven Releases'
            url = uri 'https://maven.wagyourtail.xyz/releases'
            content {
                unimined_releases.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'WagYourMaven Snapshots'
            url = uri 'https://maven.wagyourtail.xyz/snapshots'
            content {
                unimined_snapshots.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
    }
    dependencies {
        classpath "$shadow_plugin:$shadow_version"
        classpath "$unimined_plugin:$unimined_version"
    }
}

apply from: rootProject.file('gradle\\java21-module.gradle')

plugins.apply 'xyz.wagyourtail.unimined'

def base = project ':api'
def neoforge = project ':neoforge'

unimined.minecraft {
    version minecraft_1_21_1
    mappings {
        parchment parchment_1_21_1
    }
    neoForge {
        loader neoforge_1_21_1
        runs.auth.username = minecraft_username
        runs.all {
            systemProperty 'foundation.verbose', 'true'
            return
        }
    }
}

configurations {
    dev {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    compileOnlyApi base
    compileOnlyApi project(path: ':neoforge', configuration: 'dev')
    compileOnlyApi project(path: ':shared:shared_1.21', configuration: 'dev')
}

processResources {
    from neoforge.processResources.outputs
}

processTestResources {
    from neoforge.processTestResources.outputs
}

jar {
    from(neoforge.jar.archiveFile.collect { zipTree(it) })
    manifest {
        attributes([
                'Implementation-Version': mod_version
        ])
    }
    mustRunAfter ':neoforge:build'
    mustRunAfter ':shared:shared_1.21:build'
}

sourcesJar {
    mustRunAfter ':neoforge:build'
    mustRunAfter ':shared:shared_1.21:build'
}

artifacts {
    dev jar
}

tasks.remapJar {
    doFirst {
        logging.captureStandardOutput INFO
    }
    doLast {
        logging.captureStandardOutput QUIET
    }
}