void addProjectJars(String ... p_names) {
    jar {
        p_names.each {p_name ->
            from(getArchiveTaskFile(project(p_name), 'jar').collect {entry ->
                zipTree entry
            })
        }
    }
}

static FileCollection classpathCompile(Project project, String source_name) {
    return sourceSetOf(project,source_name).compileClasspath
}

static FileCollection classpathRuntime(Project project, String source_name) {
    return sourceSetOf(project,source_name).runtimeClasspath
}

static List<String> collectRunAfter(Project project) {
    def run_after = [ ':shared' ]
    //noinspection GrUnresolvedAccess
    if(project.isMinorVersion()) {
        run_after+=":${project.parent.name}"
        switch(project.name) {
            case '1.19.4': {
                run_after+=":shared_1.19.2"
                break
            }
            case '1.20.4': {
                run_after+=":shared_1.20.1"
                break
            }
            case '1.20.6': {
                run_after+=":shared_1.20.4"
                break
            }
        }
    }
    return run_after as List<String>
}

static List<Project> combinedProjects(Project project) {
    def project_names = [ ':api' ]
    if(isProjectLegacy(project)) project_names+=':legacy'
    else if(!isProjectLoaderBase(project)) project_names+=':shared'
    //noinspection GrUnresolvedAccess
    return project.getProjectList(project_names)
}

static Consumer<RepositoryHandler> commonMavenArtifact(Project project, String id) {
    Consumer<RepositoryHandler> consumer = handler -> {
        def maven_data = commonMavenData id
        int size = maven_data.size()
        if(size>1) {
            handler.maven {
                name = maven_data.get(0)
                url = project.uri "https://${maven_data.get(1)}"
                if(size>2) {
                    def included_groups = maven_data.subList(2,maven_data.size())
                    //noinspection GrUnresolvedAccess
                    content {
                        included_groups.forEach {grp ->
                            //noinspection GrUnresolvedAccess
                            includeGroup grp
                        }
                    }
                }
            }
        }
    }
    return consumer
}

@SuppressWarnings('GroovyFallthrough')
private static List<String> commonMavenData(String id) {
    switch(id) {
        case 'blamejared': case 'bookshelf': case 'crafttweaker': case 'ct': case 'darkhax': case 'gamestages':
        case 'jared': case 'zencode': case 'zen':
            return [ 'BlameJared', 'maven.blamejared.com', 'com.blamejared.crafttweaker', 'net.darkhax.bookshelf',
              'net.darkhax.gamestages', 'org.openzen.zencode' ]
        case 'cf': case 'curse': case 'curseforge': case 'cursemaven':
            return [ 'CurseMaven', 'curse.cleanroommc.com/', 'curse.maven' ]
        case 'cleanroom': case 'hei':
            return [ 'CleanroomMC', 'maven.cleanroommc.com', 'mezz', 'zone.rong' ]
        case 'fast': case 'fastutil': case 'sonatype':
            return [ 'SonaType', 'oss.sonatype.org/content/repositories/public/', 'it.unimi.dsi' ]
        case 'jei': case 'modmaven':
            return [ 'ModMaven', 'modmaven.dev', 'mezz.jei' ]
        case 'legacy': case 'moddinglegacy':
            return [ 'Modding Legacy', 'maven.moddinglegacy.com/maven', 'com.legacy' ]
        case 'modrinth':
            return [ 'Modrinth', 'api.modrinth.com/maven', 'maven.modrinth' ]
        case 'modmenu': case 'terraformers': case 'terraformersmc':
            return [ 'Terraformers', 'maven.terraformersmc.com/', 'com.terraformersmc' ]
        case 'nucleoid': case 'pb4': case 'placeholder':
            return [ 'Nucleoid', 'maven.nucleoid.xyz/', 'eu.pb4']
        default: return  []
    }
}

void createJarTasks(boolean neoforge) {
    def loaders = neoforge ? [ 'fabric', 'forge', 'neoforge' ] : [ 'fabric', 'forge' ]
    loaders.forEach {loader ->
        String task_name = "${loader}Jar"
        tasks.register(task_name, Jar) {jar_task ->
            jar_task.archiveBaseName = mod_id
            jar_task.archiveClassifier = loader
            jar_task.duplicatesStrategy = EXCLUDE
            jar_task.from sourceSetOutput(project, loader)
        }
        tasks.build.mustRunAfter task_name
    }
}

void extendFrom(String file_name) {
    apply from: rootFile(project, "gradle\\scripts\\${file_name}.gradle")
}

void extendRunnable() {
    extendFrom "java${getJavaVersion()}-module"
}

