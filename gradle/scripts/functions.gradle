static Provider<RegularFile> getArchiveTaskFile(Project project, String task_name) {
    return getArchiveTask(project, task_name).archiveFile
}

static List<FileTree> getArchiveTaskTree(Project project, String task_name) {
    return getArchiveTaskFile(project, task_name).collect{entry ->
        project.zipTree entry
    }
}

static AbstractArchiveTask getArchiveTask(Project project, String task_name) {
    return project."$task_name"
}

int getJavaVersion() {
    return isJava8() ? 8 : (isJava21() ? 21 : 17)
}

static String getParentPath(String p_name) {
    if(!p_name.startsWith(':')) p_name = ":$p_name"
    int num_parents = p_name.count '.'
    switch(num_parents) {
        case 1: return ':1.12'==p_name ? ':legacy' : "${p_name.split('_')[0]}"
        case 2: return "${p_name.split('_')[0]}${p_name.substring(0,p_name.length()-2)}"
        default: return ':cleanroom'==p_name ? ':legacy' : null
    }
}

static int getProjectJavaVersion(Project project) {
    return isProjectJava8(project) ? 8 : (isProjectJava21(project) ? 21 : 17)
}

List<Project> getProjectList(List<String> p_names) {
    return getProjectListFrom(project, p_names)
}

static List<Project> getProjectListFrom(Project reference, List<String> p_names) {
    return p_names.collect {p_name ->
        reference.project(p_name)
    }
}

static def getProjectProperty(Project project, String property_name) {
    return project."$property_name"
}

static String getTaskPath(String p_name, String task_name) {
    if(!p_name.startsWith(':')) p_name = ":$p_name"
    if(!task_name.startsWith(':')) task_name = ":$task_name"
    def parent_path = getParentPath(p_name)
    return parent_path==null ? "$p_name$task_name" : "$parent_path$p_name$task_name"
}

static def getTaskOutputs(Project project, String task_name) {
    return project."$task_name".outputs
}

void inheritCompileSources(String ... parent_names) {
    compileJava {
        parent_names.each {parent_name ->
            source javaSources(project(parent_name), 'main')
        }
    }
    compileTestJava {
        parent_names.each {parent_name ->
            source javaSources(project(parent_name), 'test')
        }
    }
}

void inheritResources(String ... parent_names) {
    processResources {
        parent_names.each {parent_name ->
            from getTaskOutputs(project(parent_name), 'processResources')
        }
    }
    processTestResources {
        parent_names.each {parent_name ->
            from getTaskOutputs(project(parent_name), 'processTestResources')
        }
    }
}

static def invokeOnProject(Project project, String method_name) {
    return project."$method_name"()
}

boolean isCleanroomProject() {
    return 'cleanroom'==name
}

boolean isJava8() {
    return [ '1.12', 'api', 'fabric', 'forge', 'legacy', 'shared_1.16' ].contains(name)
}

boolean isJava17() {
    return !isJava8() && !isJava21()
}

boolean isJava21() {
    return [ 'cleanroom', 'shared_1.20.6', 'shared_1.21', 'shared_1.21.1' ].contains(name)
}

boolean isLegacyProject() {
    return [ '1.12', 'cleanroom' ].contains(name)
}

boolean isLoaderBase() {
    return [ 'fabric', 'forge', 'legacy', 'neoforge', 'shared' ].contains(name)
}

boolean isMinorVersion() {
    return [ 'shared_1.19.2', 'shared_1.19.4', 'shared_1.20.1', 'shared_1.20.4', 'shared_1.20.6',
             'shared_1.21.1' ].contains(name)
}

boolean isNeoforgeCompatible() {
    return [ 'neoforge', 'shared_1.20', 'shared_1.20.4', 'shared_1.20.6', 'shared_1.21',
             'shared_1.21.1' ].contains(name)
}

