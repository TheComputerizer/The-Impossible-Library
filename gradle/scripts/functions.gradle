void setupFabricBase() {
    dependencies {
        Provider<String> dep_provider = fabric.versions.api.'1'.'16'.'5'
        modImplementation fabricApi.fabric(dep_provider.get())
    }
    jar {
        from(getArchiveTaskFile(project(':api'), 'jar').collect {entry ->
            zipTree entry
        })
    }
    processResources {
        def replacements = [ 'adaptor': fabric_adaptor, 'injector': fabric_injector, 'version': version ]
        inputs.properties replacements
        from(getTaskOutputs(project(':api'), 'processResources')) {
            filesMatching('fabric.mod.json') {copy_details ->
                expand replacements
            }
        }
    }
}

void setupLegacyRunnable(boolean cleanroom) {
    evaluationDependsOn ':legacy'
    extendRunnable()
    configurations {
        modCompileOnly
        modRuntimeOnly
        compileOnly.extendsFrom modCompileOnly
        runtimeOnly.extendsFrom modRuntimeOnly
    }
    uniminedCore cleanroom ? 'cleanroom' : 'forge', true, [ dev_arg, common_entrypoint_arg, core_entrypoint_arg ]
    setRepositories(cleanroom ? [ 'central', 'cf', 'ct', 'hei' ] : [ 'cf', 'ct', 'hei' ])
    dependencies {
        annotationProcessor libs.bundles.legacy.annotations
        if(cleanroom) compileOnly legacy.bundles.cleanroom.compile
        else modRuntimeOnly legacy.bundles.forge.runtime
        modCompileOnly modsBundle('legacy', 'compile')
        modImplementation modsBundle('legacy', 'implementation')
        modRuntimeOnly modsBundle('legacy', 'runtime')
        modRuntimeOnly legacy.bundles.nothirium
    }
    addProjectJars ':legacy'
    setJarsRunAfter([ ':legacy' ])
}

void setupLoaderBase(String loader) {
    extendRunnable()
    uniminedCore loader, false, []
    setDev()
    dependencies {
        api project(':api')
    }
    jar {
        manifest {
            attributes([
                    'Implementation-Title': mod_name,
                    'Implementation-Version': mod_version
            ])
        }
    }
    processTestResources {
        from getTaskOutputs(project(':api'), 'processTestResources')
    }
    setJarsRunAfter([ ':api' ])
    if('fabric'==loader) {
        setupFabricBase()
        return
    }
    processResources {
        from(getTaskOutputs(project(':api'), 'processResources')) {
            exclude 'fabric.mod.json'
        }
    }
}

void setupShared(boolean dev, List<String> run_after, List<String> repos, String ... extra_repos) {
    extendRunnable()
    setLoaderConfigs()
    if(dev) setDev()
    else if(isRunnableProject) {
        configurations {
            fabricModCompileOnly
            forgeModCompileOnly
            fabricModImplementation
            forgeModImplementation
            fabricModRuntimeOnly
            forgeModRuntimeOnly
            fabricCompileOnly.extendsFrom fabricModCompileOnly
            forgeCompileOnly.extendsFrom forgeModCompileOnly
            fabricImplementation.extendsFrom fabricModImplementation
            forgeImplementation.extendsFrom forgeModImplementation
            fabricRuntimeOnly.extendsFrom fabricModRuntimeOnly
            forgeRuntimeOnly.extendsFrom forgeModRuntimeOnly
            if(isNeoforgeCompatible) {
                neoforgeModCompileOnly
                neoforgeModImplementation
                neoforgeModRuntimeOnly
                neoforgeCompileOnly.extendsFrom neoforgeModCompileOnly
                neoforgeImplementation.extendsFrom neoforgeModImplementation
                neoforgeRuntimeOnly.extendsFrom neoforgeModRuntimeOnly
            }
        }
    }
    uniminedCommon !dev
    setSharedDependencies repos, extra_repos
    inheritResources ':shared'
    setJarsRunAfter run_after
}

void setupSharedBase() {
    evaluationDependsOn ':shared'
    setupShared true, [ ':shared' ], []
}

void setupSharedRunnable(String ... extra_repos) {
    if(isMinorVersion()) evaluationDependsOn ":shared:${parent.name}"
    else evaluationDependsOn ':shared'
    if(isNeoforgeCompatible()) evaluationDependsOn ':neoforge'
    setupShared false, collectRunAfter(project), [ 'cf', 'ct', 'jei', 'modrinth', 'modmenu' ], extra_repos
}

void setDev() {
    configurations {
        dev {
            canBeResolved = false
            canBeConsumed = true
        }
    }
    artifacts {
        //noinspection GroovyAssignabilityCheck
        dev jar
    }
}

@SuppressWarnings('GroovyAssignabilityCheck')
void setLoaderConfigs() {
    boolean neoforge_compatible = isNeoforgeCompatible()
    sourceSets {
        def main_output = sourceSetOutput(project, 'main')
        fabric {
            compileClasspath+=main_output
            runtimeClasspath+=main_output
        }
        forge {
            compileClasspath+=main_output
            runtimeClasspath+=main_output
        }
        if(neoforge_compatible) {
            neoforge {
                compileClasspath+=main_output
                runtimeClasspath+=main_output
            }
        }
    }
    createJarTasks neoforge_compatible
    configurations {
        fabric {
            canBeResolved = false
            canBeConsumed = true
        }
        forge {
            canBeResolved = false
            canBeConsumed = true
        }
        if(neoforge_compatible) {
            neoforge {
                canBeResolved = false
                canBeConsumed = true
            }
        }
    }
    artifacts {
        fabric fabricJar
        forge forgeJar
        if(neoforge_compatible) neoforge neoforgeJar
    }
}

void setJarsRunAfter(List<String> parent_names) {
    def build_tasks = parent_names.collect {parent_name ->
        getTaskPath(parent_name, 'build')
    }
    jar {
        manifest {
            Map<?,Object> attribute_map = [ 'Implementation-Title': mod_name, 'Implementation-Version': mod_version ]
            if(isLegacyProject()) {
                attribute_map.put('FMLCorePlugin', legacy_entrypoint)
                attribute_map.put('FMLCorePluginContainsFMLMod', true)
                attribute_map.put('ForceLoadAsMod', true)
            }
            attributes(attribute_map)
        }
        build_tasks.forEach {build_task ->
            mustRunAfter build_task
        }
    }
    sourcesJar {
        build_tasks.forEach {build_task ->
            mustRunAfter build_task
        }
    }
}

void setSharedDependencies(List<String> maven_ids, String ... extra_maven_ids) {
    maven_ids.addAll extra_maven_ids
    setRepositories maven_ids
    dependencies {
        boolean minor_version = isMinorVersion()
        if(minor_version) compileOnlyApi parent
        if(isSharedProject()) {
            def versions = name.split('_')[1].split '\\.'
            def dep_provider = fabric.versions.api.'1'."${versions[1]}"
            if(versions.length==3) dep_provider = dep_provider."${versions[2]}"
            else dep_provider = dep_provider.asProvider()
            //noinspection GrUnresolvedAccess
            fabricImplementation fabricApi.fabric(dep_provider.get())
        }
        def types = isNeoforgeCompatible() ? [ 'fabric', 'forge', 'neoforge' ] : [ 'fabric', 'forge' ]
        boolean is_runnable = isRunnableProject()
        types.forEach {loader ->
            logger.lifecycle "Applying $loader-specific dependencies for $name"
            "${loader}CompileOnly" project(path: ":$loader", configuration: 'dev')
            if(is_runnable) {
                if(minor_version) {
                    "${loader}Implementation" parent
                    "${loader}Implementation" project(path: parent.path, configuration: "$loader")
                }
                if(isSharedProject()) {
                    "${loader}Implementation" libs.bundles.burningwave
                    "${loader}AnnotationProcessor" libs.lombok
                    "${loader}CompileOnly" libs.lombok
                }
                "${loader}Implementation" modsBundle(loader, 'implementation')
                "${loader}RuntimeOnly" modsBundle(loader, 'runtime')
            }
        }
    }
}

void setRepositories(List<String> maven_ids) {
    project.repositories {handler ->
        maven_ids.forEach {id ->
            if('central'==id) mavenCentral()
            else {
                def consumer = commonMavenArtifact project, id
                if(consumer!=null) {
                    //noinspection GroovyAssignabilityCheck
                    consumer.accept handler
                }
            }
        }
    }
}

static SourceSet sourceSetOf(Project project, String source_name) {
    return getProjectProperty(project, 'sourceSets')."$source_name"
}

static SourceSetOutput sourceSetOutput(Project project, String source_name) {
    return sourceSetOf(project, source_name).output
}

@SuppressWarnings('GrUnresolvedAccess')
void uniminedCore(String loader_name, boolean is_runnable, List<String> extra_args) {
    logger.lifecycle "Setting up core unimined stuff for $name"
    unimined.useGlobalCache = false
    boolean official_mappings = mappingStyleOfficial() || loader_name=='neoforge'
    def production_namespace = 'cleanroom'==loader_name || 'forge'==loader_name ? 'searge' :
            ('fabric'==loader_name ? 'intermediary' : 'mojmap')
    boolean should_remap_for_production = !official_mappings && production_namespace!='mojmap'
    unimined.minecraft {
        def mc_version = minecraftVersion()
        logger.lifecycle "Got unimined minecraft version for $name as $mc_version"
        version mc_version
        def combined = combinedProjects(project)
        combined.forEach {combined_project ->
            combineWith combined_project, sourceSetOf(combined_project, 'main')
        }
        mappings {
            if(isLegacyProject()) mcp 'stable', legacy_mappings_1_12_2
            else {
                if(!official_mappings) intermediary()
                mojmap()
                if(isJava8()) parchment mc_version, parchmentVersion()
                devNamespace 'mojmap'
            }
        }
        defaultRemapJar = !official_mappings
        if('none'!=loader_name) {
            runs {
                if(is_runnable) {
                    config('client') {
                        javaVersion = isJava8 ? VERSION_1_8 : (isJava17 ? VERSION_17 : VERSION_21)
                        if(!extra_args.isEmpty()) args+=extra_args
                    }
                } else off = true
            }
        }
        switch(loader_name) {
            case 'cleanroom': {
                cleanroom {
                    loader cleanroom_loader_version
                }
                break
            }
            case 'fabric': {
                //noinspection GroovyAssignabilityCheck
                fabric {
                    loader fabric_loader
                }
                break
            }
            case 'forge': {
                minecraftForge {
                    loader forgeVersion()
                }
                break
            }
            case 'neoforge': {
                neoForge {
                    loader neoforgeVersion()
                }
                break
            }
            default: {
                defaultRemapJar = false
                break
            }
        }
        if(isRunnableProject()) {
            def loader_configs = [ ]
            if(isLegacyProject()) loader_configs = [ 'modCompileOnly', 'modRuntimeOnly' ]
            //else {
            //    def loaders = official_mappings ? [ 'fabric' ] :
            //            (isNeoforgeCompatible ? [ 'fabric', 'forge', 'neoforge' ] : [ 'fabric', 'forge' ])
            //    loaders.forEach {loader ->
            //        loader_configs+=[ "${loader}ModCompileOnly", "${loader}ModRuntimeOnly" ]
            //    }
            //}
            if(!loader_configs.isEmpty()) {
                logger.lifecycle "Enabling remapping for loader configs: $loader_configs"
                mods {
                    loader_configs.forEach {loader_config ->
                        remap(configurations."$loader_config") {
                            catchAWNamespaceAssertion()
                        }
                    }
                }
            }
        }
    }
    //If it's already mojmap we don't need to remap it again
    if(should_remap_for_production) {
        remapJar {
            archiveBaseName = mod_id
            archiveClassifier = 'remapped'
            prodNamespace production_namespace
        }
    }
    logger.lifecycle "Finished setting up core unimined stuff for $name"
}

void uniminedCommon(boolean is_runnable) {
    uniminedCore 'none', false, []
    uniminedFabric is_runnable, []
    uniminedForge is_runnable, []
    if(isNeoforgeCompatible()) uniminedNeoforge is_runnable, []
}

@SuppressWarnings('GrUnresolvedAccess')
void uniminedFabric(boolean is_runnable, List<String> extra_args) {
    unimined.minecraft(sourceSets.fabric) {
        combineWith sourceSets.main
        defaultRemapJar = true
        //noinspection GroovyAssignabilityCheck
        fabric {
            loader fabric_loader
        }
        runs {
            if(is_runnable) {
                config('client') {
                    javaVersion = isJava8 ? VERSION_1_8 : (isJava17 ? VERSION_17 : VERSION_21)
                    if(!extra_args.isEmpty()) args+=extra_args
                }
            } else off = true
        }
    }
    def classifier = 'fabric-remapped'
    remapFabricJar {
        archiveBaseName = mod_id
        archiveClassifier = classifier
        prodNamespace 'intermediary'
    }
    // Only fabric is relocated since forge and neoforge technically both use the same intermediary
    // production namespace in 1.20.1 before neoforge switched to using official mappings
    shadowJar {
        archiveBaseName = mod_id
        archiveClassifier = "$classifier-relocated"
        //noinspection GroovyAssignabilityCheck
        configurations = [ project.configurations.shadow ]
        from(getArchiveTaskFile(project, 'remapFabricJar').collect{entry ->
            zipTree entry
        })
        mustRunAfter remapFabricJar
        //noinspection GroovyAssignabilityCheck
        relocate "${base_package}.shared", "${base_package}.fabric"
    }
    tasks.build.mustRunAfter shadowJar
}

