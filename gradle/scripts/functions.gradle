Provider<ExternalModuleDependencyBundle> modsBundle(String loader, String type) {
    if(isLegacyProject()) return legacy.bundles.mods.'1'.'12'.'2'."$type"
    String[] mc = projectMCVersion().split '_'
    return project."$loader".bundles.mods.'1'."${mc[1]}"."${mc[2]}"."$type"
}

String neoforgeVersion() {
    return withMCVersion('neoforge')
}

String parchmentVersion() {
    return withMCVersion('parchment')
}

@SuppressWarnings('GroovyFallthrough')
String projectMCVersion() {
    switch(name) {
        case 'cleanroom':
        case 'legacy': return '1_12_2'
        case 'fabric':
        case 'forge': return '1_16_5'
        case 'neoforge': return '1_20_4'
        default: {
            String mc_version = name.split('_').last().replace('.','_')
            switch(mc_version) {
                case '1_12': return '1_12_2'
                case '1_16': return '1_16_5'
                case '1_18': return '1_18_2'
                case '1_19': return '1_19_2'
                case '1_20': return '1_20_1'
                case '1_21': return '1_21_1'
                default: return mc_version
            }
        }
    }
}

