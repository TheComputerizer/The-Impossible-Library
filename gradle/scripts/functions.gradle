static List<Project> combinedProjects(Project project) {
    return project.isLoaderBase() ? [ project.project(':api') ] : [ project.project(':api'), project.project(':shared') ]
}

static Consumer<RepositoryHandler> commonMavenArtifact(Project project, String id) {
    Consumer<RepositoryHandler> consumer = handler -> {
        if('central'==id) {
            handler.mavenCentral()
            return
        }
        def maven_data = commonMavenData id
        int size = maven_data.size()
        if(size>1) {
            handler.maven {
                name = maven_data.get(0)
                url = project.uri maven_data.get(1)
                if(size>2) {
                    def included_groups = maven_data.subList(2,maven_data.size())
                    content {
                        included_groups.forEach {grp ->
                            includeGroup grp
                        }
                    }
                }
            }
        }
    }
    return consumer
}

@SuppressWarnings('GroovyFallthrough')
private static List<String> commonMavenData(String id) {
    switch(id) {
        case 'blamejared': case 'bookshelf': case 'crafttweaker': case 'ct': case 'darkhax': case 'gamestages':
        case 'jared': case 'zencode': case 'zen':
            return [ 'BlameJared', 'https://maven.blamejared.com', 'com.blamejared.crafttweaker', 'net.darkhax.bookshelf',
              'net.darkhax.gamestages', 'org.openzen.zencode' ]
        case 'cf': case 'curse': case 'curseforge': case 'cursemaven':
            return [ 'CurseMaven', 'https://curse.cleanroommc.com/', 'curse.maven' ]
        case 'cleanroom': case 'hei':
            return [ 'CleanroomMC', 'https://maven.cleanroommc.com', 'mezz' ]
        case 'fast': case 'fastutil': case 'sonatype':
            return [ 'SonaType', 'https://oss.sonatype.org/content/repositories/public/', 'it.unimi.dsi' ]
        case 'jei': case 'modmaven':
            return [ 'ModMaven', 'https://modmaven.dev', 'mezz.jei' ]
        case 'legacy': case 'moddinglegacy':
            return [ 'Modding Legacy', 'https://maven.moddinglegacy.com/maven', 'com.legacy' ]
        case 'modrinth':
            return [ 'Modrinth', 'https://api.modrinth.com/maven', 'maven.modrinth' ]
        case 'modmenu': case 'terraformers': case 'terraformersmc':
            return [ 'Terraformers', 'https://maven.terraformersmc.com/', 'com.terraformersmc' ]
        case 'nucleoid': case 'pb4': case 'placeholder':
            return [ 'Nucleoid', 'https://maven.nucleoid.xyz/', 'eu.pb4']
        default: return  []
    }
}

void extendFrom(String file_name) {
    apply from: rootProject.file("gradle\\scripts\\${file_name}.gradle")
}

void extendRunnable(int java_version) {
    extendFrom "java$java_version-module"
}

String fabricVersion() {
    return withMCVersion('fabric')
}

String forgeVersion() {
    return withMCVersion('forge')
}

static String getParentPath(String project_name) {
    int num_parents = project_name.count '.'
    switch(num_parents) {
        case 1: return "${project_name.split('_')[0]}"
        case 2: return "${project_name.split('_')[0]}${project_name.substring(0,project_name.length()-2)}"
        default: return project_name.contains('cleanroom') ? ':legacy' : null
    }
}

static String getProjectPath(String project_name) {
    int num_parents = project_name.count '.'
    switch(num_parents) {
        case 1: return "${project_name.split('_')[0]}$project_name"
        case 2: return "${project_name.split('_')[0]}${project_name.substring(0,project_name.length()-2)}$project_name"
        default: return project_name.contains('cleanroom') ? ':legacy:cleanroom' : project_name
    }
}

void inheritCompileSources(String ... parent_names) {
    compileJava {
        parent_names.each {parent_name ->
            source project(parent_name).sourceSets.main.allJava
        }
    }
    compileTestJava {
        parent_names.each {parent_name ->
            source project(parent_name).sourceSets.test.allJava
        }
    }
}

void inheritResources(String ... parent_names) {
    processResources {
        parent_names.each {parent_name ->
            from project(parent_name).processResources.outputs
        }
    }
    processTestResources {
        parent_names.each {parent_name ->
            from project(parent_name).processTestResources.outputs
        }
    }
}

boolean isCleanroomProject() {
    return 'cleanroom'==name
}

boolean isLegacyProject() {
    return 'legacy'==name || (parent!=null && parent.isLegacy())
}

boolean isLoaderBase() {
    return [ 'fabric', 'forge', 'legacy', 'neoforge' ].contains(name)
}

boolean isMinorVersion() {
    return project!=null && name.count('.')>=2
}

/**
 * Assumed the input project has a version association
 */
boolean mappingStyleOfficial() {
    return name.contains('21') || name.contains('20.6') || name.contains('20_6')
}

String minecraftVersion() {
    return withMCVersion('minecraft')
}

Provider<ExternalModuleDependencyBundle> modsBundle(String loader, String type) {
    if(isLegacyProject()) return legacy.bundles.mods.'1'.'12'.'2'."$type"
    String[] mc = projectMCVersion().split '_'
    return project."$loader".bundles.mods.'1'."${mc[1]}"."${mc[2]}"."$type"
}

String neoforgeVersion() {
    return withMCVersion('neoforge')
}

String parchmentVersion() {
    return withMCVersion('parchment')
}

String projectMCVersion() {
    switch(name) {
        case 'cleanroom': return '1_12_2'
        case 'fabric': return '1_16_5'
        case 'forge': return '1_16_5'
        case 'legacy': return '1_12_2'
        case 'neoforge': return '1_20_4'
        default: {
            String mc_version = name.split('_').last().replace('.','_')
            switch(mc_version) {
                case '1_12': return '1_12_2'
                case '1_16': return '1_16_5'
                case '1_18': return '1_18_2'
                case '1_19': return '1_19_2'
                case '1_20': return '1_20_1'
                case '1_21': return '1_21_1'
                default: return mc_version
            }
        }
    }
}

String propertyString(String name) {
    return String.valueOf(property(name))
}

void remapJarDefaults() {
    project.tasks.remapJar {
        doFirst {
            logging.captureStandardOutput INFO
        }
        doLast {
            logging.captureStandardOutput QUIET
        }
    }
}

void setDev() {
    configurations {
        dev {
            canBeResolved = false
            canBeConsumed = true
        }
    }
    artifacts {
        dev jar
    }
}

void setJarsRunAfter(boolean finalized_by_shadow, String ... parent_names) {
    jar {
        parent_names.each {parent_name ->
            mustRunAfter "${getProjectPath(parent_name)}:build"
        }
        if(finalized_by_shadow) finalizedBy 'shadowJar'
    }
    sourcesJar {
        parent_names.each {parent_name ->
            mustRunAfter "${getProjectPath(parent_name)}:build"
        }
    }
}

void setSharedDependencies(boolean neoforge, boolean extra_parent, String ... maven_ids) {
    setRepositories maven_ids
    dependencies {
        if(extra_parent) compileOnlyApi parent
        if(name.contains('shared')) {
            def versions = name.split('_')[1].split '\\.'
            def dep_provider = fabric.versions.api.'1'."${versions[1]}"
            if(versions.length==3) dep_provider = dep_provider."${versions[2]}"
            else dep_provider = dep_provider.asProvider()
            fabricImplementation fabricApi.fabric(dep_provider.get())
        }
        def types = neoforge ? [ 'fabric', 'forge', 'neoforge' ] : [ 'fabric', 'forge' ]
        boolean is_runnable = extra_parent || name.contains('16') || name.contains('18')
        types.forEach {loader ->
            logger.lifecycle "Applying $loader-specific dependencies for $name"
            "${loader}CompileOnly" project(path: ":$loader", configuration: 'dev')
            if(is_runnable) {
                if(extra_parent) "${loader}Implementation" parent
                "${loader}Implementation" modsBundle(loader, 'implementation')
                "${loader}RuntimeOnly" modsBundle(loader, 'runtime')
            }
        }
    }
}

void setSharedShadowJar(String ... project_names) {
    shadowJar {
        project_names.each {p_name ->
            from(project(p_name).jar.archiveFile.collect {entry ->
                zipTree entry
            })
        }
        shadowJar.finalizedBy 'remapJar'
    }
}

void setRepositories(String ... maven_ids) {
    project.repositories {handler ->
        maven_ids.each {id ->
            def consumer = commonMavenArtifact project, id
            if(consumer!=null) consumer.accept handler
        }
    }
}

void uniminedCore(String loader_name, boolean is_runnable, List<String> args) {
    logger.lifecycle "Setting up core unimined stuff for $name"
    unimined.minecraft {
        def mc_version = minecraftVersion()
        logger.lifecycle "Got unimined minecraft version for $name as $mc_version"
        version mc_version
        combinedProjects(project).forEach {combined_project ->
            combineWith combined_project, combined_project.sourceSets.main
        }
        mappings {
            if(isLegacyProject()) {
                if(!isCleanroomProject()) searge()
                mcp 'stable', legacy_mappings_1_12_2
            } else {
                def fallback_mappings = 'intermediary'
                if(mappingStyleOfficial()) fallback_mappings = 'official'
                else intermediary()
                mojmap()
                parchment parchmentVersion()
                devFallbackNamespace fallback_mappings
            }
        }
        switch(loader_name) {
            case 'cleanroom': {
                cleanroom {
                    loader cleanroom_loader_version
                    if(is_runnable) {
                        runs.all {
                            systemProperty 'foundation.verbose', 'true'
                            if(!args.isEmpty()) jvmArgs args
                        }
                    }
                }
                break
            }
            case 'fabric': {
                fabric {
                    loader fabric_loader
                    if(is_runnable) {
                        runs.all {
                            systemProperty 'foundation.verbose', 'true'
                            if(!args.isEmpty()) jvmArgs args
                        }
                    }
                }
                break
            }
            case 'forge': {
                minecraftForge {
                    loader forgeVersion()
                    if(is_runnable) {
                        runs.all {
                            systemProperty 'foundation.verbose', 'true'
                            if(!args.isEmpty()) jvmArgs args
                        }
                    }
                }
                break
            }
            case 'neoforge': {
                neoForge {
                    loader neoforgeVersion()
                    if(is_runnable) {
                        runs.all {
                            systemProperty 'foundation.verbose', 'true'
                            if(!args.isEmpty()) jvmArgs args
                        }
                    }
                }
                break
            }
        }
        if(!is_runnable) defaultRemapJar = false
    }
    logger.lifecycle "Finished setting up core unimined stuff for $name"
}

void uniminedCommon() {
    uniminedCore 'none', false, []
}

