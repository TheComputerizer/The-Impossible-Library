import static org.gradle.api.file.DuplicatesStrategy.EXCLUDE

plugins.apply 'idea'
plugins.apply 'java'
plugins.apply 'java-library'

apply from: rootProject.file('gradle\\scripts\\functions.gradle')

group = base_package
version = mod_version

compileJava {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

jar {
    duplicatesStrategy = EXCLUDE
    setArchiveBaseName "$mod_id"
}

java {
    withSourcesJar()
    withJavadocJar()
}

javadocJar {
    duplicatesStrategy = EXCLUDE
    setArchiveBaseName "$mod_id"
}

processResources {
    duplicatesStrategy = EXCLUDE
}

sourcesJar {
    duplicatesStrategy = EXCLUDE
    setArchiveBaseName "$mod_id"
}