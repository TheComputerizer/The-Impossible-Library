/**
 * Forge implementation for 1.21.1
 */
//file:noinspection GroovyAssignabilityCheck
buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                plugin_portal_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'Forge'
            url = uri 'https://maven.minecraftforge.net/'
            content {
                forge_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'ParchmentMC'
            url = uri 'https://maven.parchmentmc.org'
            content {
                parchment_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
    }
    dependencies {
        classpath "$shadow_plugin:$shadow_version"
        classpath "$forge_gradle_plugin:$forge_gradle_version"
        classpath "$parchment_plugin:$parchment_plugin_version"
    }
}

apply from: rootProject.file('gradle\\java23-module.gradle')

plugins.apply 'net.minecraftforge.gradle'
plugins.apply 'org.parchmentmc.librarian.forgegradle'

def base = project ':api'
def forge = project ':forge:forge_1.21'
def shared = project ':shared:shared_1.21:shared_1.21.1'

def classpath_file = "$mod_id-${mod_version}_mapped_parchment_$parchment_1_21_1-${minecraft_1_21_1}.jar"

minecraft {
    copyIdeResources = true
    mappings channel: 'parchment', version: "$parchment_1_21_1-$minecraft_1_21_1"
    runs {
        def runSources = [ sourceSets.main ]
        def args = [ dev_arg, "$classpath_arg$classpath_file".toString(), common_entrypoint_arg, core_entrypoint_arg ]
        configureEach {
            def srgToMcpFile = project.tasks.createSrgToMcp.outputs.files[0].path
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', forge_log_level
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', srgToMcpFile
            property 'net.minecraftforge.gradle.GradleStart.srg.srg-mcp', srgToMcpFile
            setSources runSources
            jvmArgs args
        }
        client {
            workingDirectory file('run_client')
        }
        server {
            workingDirectory file('run_server')
        }
    }
}

repositories {
    maven {
        name = 'CurseMaven'
        url = uri 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'ModMaven'
        url = uri 'https://modmaven.dev'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    //noinspection VulnerableLibrariesLocal
    minecraft "$forge_mc:$forge_1_21_1"

    compileOnlyApi base
    //implementation(project(path: ':forge', configuration: 'dev'))
    compileOnlyApi forge
    compileOnlyApi shared

    implementation fg.deobf("$configured_artifact:$configured_forge_1_21")
    implementation fg.deobf("$infernal_mobs_artifact:$infernal_mobs_forge_1_21_1")
    implementation fg.deobf("$serene_seasons_artifact:$serene_seasons_forge_1_21_1")

    runtimeOnly fg.deobf("$jei_artifact:$jei_forge_1_21_1")
}

processResources {
    //from(project(':forge').processResources.outputs)
}

processTestResources {
    //from(project(':forge').processTestResources.outputs)
}

jar {
    //from(project(':forge').jar.archiveFile.collect { zipTree(it) })
}

reobf {
    shadowJar {
        dependsOn createMcpToSrg
        mappings = createMcpToSrg.output
    }
}

shadowJar {
    from(base.jar.archiveFile.collect { zipTree it })
    shared.afterEvaluate {
        from(shared.jar.archiveFile.collect { zipTree it })
        relocate shared_base_package, forge_base_package
    }
}

tasks.assemble.dependsOn shadowJar
tasks.shadowJar.dependsOn 'reobfJar'
tasks.jar.finalizedBy 'reobfJar'
tasks.jar.dependsOn ':forge:build'
tasks.compileJava.mustRunAfter ':forge:forge_1.21:shadowJar'