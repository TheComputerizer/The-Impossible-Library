/**
 * Common builds and sources relevant to all Forge modules
 *
 * Based in 1.16.5
 */
//file:noinspection GroovyAssignabilityCheck
buildscript {
    repositories {
        gradlePluginPortal() {
            content {
                plugin_portal_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'Forge'
            url = uri 'https://maven.minecraftforge.net/'
            content {
                forge_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
        maven {
            name = 'ParchmentMC'
            url = uri 'https://maven.parchmentmc.org'
            content {
                parchment_content.split(';').each {grp ->
                    includeGroup grp
                }
            }
        }
    }
    dependencies {
        classpath "$shadow_plugin:$shadow_version"
        classpath "$forge_gradle_plugin:$forge_gradle_version"
        classpath "$parchment_plugin:$parchment_plugin_version"
    }
}

apply from: rootProject.file('gradle\\java8-module.gradle')

plugins.apply 'net.minecraftforge.gradle'
plugins.apply 'org.parchmentmc.librarian.forgegradle'

def base = project ':api'

minecraft {
    mappings channel: 'parchment', version: "$parchment_1_16_5-$minecraft_1_16_5"
}

configurations {
    dev {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    //noinspection VulnerableLibrariesLocal
    minecraft "${forge_mc}:${forge_1_16_5}"

    api base
}

processResources {
    from(base.processResources.outputs) {
        exclude 'fabric.mod.json'
    }
}

processTestResources {
    from base.processTestResources.outputs
}

jar {
    manifest {
        attributes([
                'FMLAT': mod_accesstransformer,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version
        ])
    }
}

artifacts {
    dev jar
}

tasks.jar.dependsOn ':api:build'