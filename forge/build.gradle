/**
 * Common builds and sources relevant to all Forge modules. Based in 1.16.5
 */
plugins {
    alias libs.plugins.unimined
    alias libs.plugins.shadow
}

extendRunnable project, 8

uniminedCore project, 'forge', false, []

setDev

def base = project ':api'

dependencies {
    api base
}

jar {
    manifest {
        attributes([
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version
        ])
    }
    mustRunAfter ':api:build'
}

processResources {
    from(base.processResources.outputs) {
        exclude 'fabric.mod.json'
    }
}

processTestResources {
    from base.processTestResources.outputs
}

sourcesJar {
    mustRunAfter ':api:build'
}